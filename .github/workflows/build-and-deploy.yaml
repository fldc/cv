name: Build and Deploy
on:
  push:
    branches:
      - '**'
  workflow_call:
    secrets:
      API_TOKEN_GITHUB:
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          check-latest: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Deploy 🚀
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: ${{ secrets.API_TOKEN_GITHUB }}
          repository-name: fldc/fldc.github.io
          branch: gh-pages
          folder: build
